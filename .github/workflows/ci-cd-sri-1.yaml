# =============================================================================
# CI/CD Pipeline for sri-1
# Generated by Opsera Code-to-Cloud v0.6
# Learning #427: Comprehensive pipeline with quality gates
# =============================================================================
name: CI/CD - sri-1

on:
  push:
    branches: [main, develop]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        type: string
        description: 'Target environment (dev, staging, prod, etc.)'
        default: 'dev'
      skip_tests:
        type: boolean
        description: 'Skip test stage'
        default: false

env:
  APP_NAME: sri-1
  AWS_REGION: us-west-2
  TENANT: opsera
  # Cluster naming: {tenant}-{short-region}-{prod|np}
  EKS_CLUSTER: opsera-uw2-np

jobs:
  # ===========================================================================
  # Job 1: Build and Test
  # ===========================================================================
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Linting
        run: npm run lint
        continue-on-error: true

      - name: Run Tests
        if: ${{ !inputs.skip_tests }}
        run: npm run test

      - name: Build Application
        run: npm run build

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-dist
          path: dist/
          retention-days: 1

  # ===========================================================================
  # Job 2: Security Scan
  # ===========================================================================
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run npm audit
        run: npm audit --audit-level=high
        continue-on-error: true

  # ===========================================================================
  # Job 3: Build and Push Docker Image
  # ===========================================================================
  build-push-image:
    name: Build & Push Image
    runs-on: ubuntu-latest
    needs: [build-and-test, security-scan]
    outputs:
      image_uri: ${{ steps.build.outputs.image_uri }}
      image_tag: ${{ steps.meta.outputs.version }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-dist
          path: dist/

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Create ECR Repository (if not exists)
        run: |
          aws ecr describe-repositories --repository-names ${{ env.TENANT }}-${{ env.APP_NAME }} --region ${{ env.AWS_REGION }} || \
          aws ecr create-repository \
            --repository-name ${{ env.TENANT }}-${{ env.APP_NAME }} \
            --region ${{ env.AWS_REGION }} \
            --image-scanning-configuration scanOnPush=true \
            --encryption-configuration encryptionType=AES256

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Docker Meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.login-ecr.outputs.registry }}/${{ env.TENANT }}-${{ env.APP_NAME }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Docker Image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Output Image URI
        id: output
        run: |
          echo "image_uri=${{ steps.login-ecr.outputs.registry }}/${{ env.TENANT }}-${{ env.APP_NAME }}:${{ steps.meta.outputs.version }}" >> $GITHUB_OUTPUT

  # ===========================================================================
  # Job 4: Container Security Scan (Grype)
  # ===========================================================================
  container-scan:
    name: Container Scan (Grype)
    runs-on: ubuntu-latest
    needs: build-push-image
    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Run Grype Scan
        uses: anchore/scan-action@v4
        with:
          image: ${{ needs.build-push-image.outputs.image_uri }}
          fail-build: false
          severity-cutoff: critical
        continue-on-error: true

  # ===========================================================================
  # Job 5: Update Kustomize Image Tag
  # ===========================================================================
  update-kustomize:
    name: Update Kustomize
    runs-on: ubuntu-latest
    needs: [build-push-image, container-scan]
    if: github.ref == 'refs/heads/main'
    env:
      ENVIRONMENT: ${{ inputs.environment || 'dev' }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Get AWS Account ID
        id: aws
        run: |
          AWS_ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          echo "account_id=$AWS_ACCOUNT_ID" >> $GITHUB_OUTPUT

      - name: Update Kustomize Image
        run: |
          cd .opsera-${{ env.APP_NAME }}/k8s/overlays/${{ env.ENVIRONMENT }}

          # Get the image tag from the build job
          IMAGE_TAG="${{ needs.build-push-image.outputs.image_tag }}"
          ECR_REPO="${{ steps.aws.outputs.account_id }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ env.TENANT }}-${{ env.APP_NAME }}"

          # Update kustomization.yaml with new image
          cat > kustomization.yaml << EOF
          apiVersion: kustomize.config.k8s.io/v1beta1
          kind: Kustomization

          namespace: ${{ env.APP_NAME }}-${{ env.ENVIRONMENT }}

          resources:
            - ../../base
            - namespace.yaml

          commonLabels:
            environment: ${{ env.ENVIRONMENT }}

          images:
            - name: IMAGE_PLACEHOLDER
              newName: ${ECR_REPO}
              newTag: "${IMAGE_TAG}"

          replicas:
            - name: ${{ env.APP_NAME }}
              count: 1
          EOF

      - name: Commit and Push Changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add .opsera-${{ env.APP_NAME }}/k8s/overlays/${{ env.ENVIRONMENT }}/kustomization.yaml

          # Only commit if there are changes
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update ${{ env.APP_NAME }} image to ${{ needs.build-push-image.outputs.image_tag }}"

            # Retry push with rebase (Learning #AKS-007)
            for i in 1 2 3; do
              git pull --rebase origin main && git push origin main && break
              echo "Retry $i: Pull and push failed, retrying..."
              sleep 5
            done
          fi

  # ===========================================================================
  # Job 6: Wait for ArgoCD Sync
  # ===========================================================================
  wait-for-deployment:
    name: Wait for Deployment
    runs-on: ubuntu-latest
    needs: update-kustomize
    if: github.ref == 'refs/heads/main'
    env:
      ENVIRONMENT: ${{ inputs.environment || 'dev' }}
    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update Kubeconfig
        run: |
          aws eks update-kubeconfig --name ${{ env.EKS_CLUSTER }} --region ${{ env.AWS_REGION }}

      - name: Wait for Rollout
        run: |
          echo "Waiting for deployment rollout..."
          kubectl rollout status deployment/${{ env.APP_NAME }} \
            -n ${{ env.APP_NAME }}-${{ env.ENVIRONMENT }} \
            --timeout=300s || echo "Rollout status check timed out"

      - name: Get Deployment Status
        run: |
          echo "=== Deployment Status ==="
          kubectl get deployment ${{ env.APP_NAME }} -n ${{ env.APP_NAME }}-${{ env.ENVIRONMENT }} -o wide

          echo ""
          echo "=== Pods ==="
          kubectl get pods -n ${{ env.APP_NAME }}-${{ env.ENVIRONMENT }} -l app=${{ env.APP_NAME }}

          echo ""
          echo "=== Service ==="
          kubectl get svc ${{ env.APP_NAME }} -n ${{ env.APP_NAME }}-${{ env.ENVIRONMENT }}

  # ===========================================================================
  # Job 7: Deployment Summary
  # ===========================================================================
  summary:
    name: Deployment Summary
    runs-on: ubuntu-latest
    needs: wait-for-deployment
    if: always() && github.ref == 'refs/heads/main'
    env:
      ENVIRONMENT: ${{ inputs.environment || 'dev' }}
    steps:
      - name: Summary
        run: |
          echo "## Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Application | ${{ env.APP_NAME }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Environment | ${{ env.ENVIRONMENT }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Image Tag | ${{ needs.build-push-image.outputs.image_tag }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Namespace | ${{ env.APP_NAME }}-${{ env.ENVIRONMENT }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Workflow | ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }} |" >> $GITHUB_STEP_SUMMARY
