# =============================================================================
# Kustomize Dev Overlay for sri-1
# Generated by Opsera Code-to-Cloud v0.6
# Learning #337: Kustomize handles image tag updates via CI/CD
# =============================================================================
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

metadata:
  name: sri-1-dev

namespace: sri-1-dev

resources:
  - ../../base
  - namespace.yaml

commonLabels:
  environment: dev

# Image will be updated by CI/CD pipeline
images:
  - name: IMAGE_PLACEHOLDER
    newName: ${AWS_ACCOUNT_ID}.dkr.ecr.us-west-2.amazonaws.com/opsera-sri-1
    newTag: latest

replicas:
  - name: sri-1
    count: 1

patches:
  - target:
      kind: Deployment
      name: sri-1
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/cpu
        value: "50m"
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: "64Mi"
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/cpu
        value: "500m"
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: "512Mi"
